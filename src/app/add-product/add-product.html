<div class="Page_Background">

  <!-- Header -->
  <div class="page-header mb-4">
    <h3>Add New Product</h3>
    <p class="text-muted">Create and manage inventory items</p>
  </div>

  <form [formGroup]="productForm" class="row g-4" (ngSubmit)="submitProduct()">

    <!-- Basic Info -->
    <div class="col-lg-8">
      <div class="card custom-card">
        <div class="card-header">
          <i class="bi bi-box"></i>
          <span>Product Information</span>
        </div>

        <div class="card-body row g-3">
          <div class="col-md-6">
            <label class="form-label">Product Image<span class="text-danger">*</span></label>
            <input type="file" class="form-control custom-form-control" (change)="onImageSelected($event)" accept="image/*" id="PrdImg">
          </div>


          <div class="col-md-6">
            <label class="form-label">Product Name<span class="text-danger">*</span></label>
            <input type="text" class="form-control custom-form-control" formControlName="name">
          </div>

          <div class="col-md-6">
            <label class="form-label">SKU</label>
            <input type="text" class="form-control custom-form-control" formControlName="sku" id="sku">
          </div>

          <div class="col-md-6">
            <label class="form-label">Category<span class="text-danger">*</span></label>
            <select class="form-select custom-form-control" formControlName="Category_id" id="Category_id">
              <option value="0">select Category</option>
              <option value="1">Electronics</option>
              <option value="2">Furniture</option>
              <option value="3">Grocery</option>
            </select>
          </div>

          <div class="col-md-6">
            <input type="checkbox" formControlName="isActive"> <label class="form-label">Active</label>
          </div>

          <div class="col-12">  
            <label class="form-label">Description</label>
            <textarea rows="3" class="form-control custom-form-control" formControlName="description"></textarea>
          </div>
        </div>
      </div>
    </div>

    <!-- Pricing & Stock -->
    <div class="col-lg-4">
      <div class="card custom-card">
        <div class="card-header">
          <i class="bi bi-currency-rupee"></i>
          <span>Pricing & Stock</span>
        </div>

        <div class="card-body">
          <div class="mb-3">
            <label class="form-label">Price<span class="text-danger">*</span></label>
            <input type="number" class="form-control custom-form-control" formControlName="price">
          </div>

           <div class="mb-3">
            <label class="form-label">Original Price<span class="text-danger">*</span></label>
            <input type="number" class="form-control custom-form-control" formControlName="Original_Cost">
          </div>

          <div class="mb-3">
            <label class="form-label">Quantity<span class="text-danger">*</span></label>
            <input type="number" class="form-control custom-form-control" formControlName="quantity">
          </div>

          <div class="mb-3">
            <label class="form-label">Reorder Level<span class="text-danger">*</span></label>
            <input type="number" class="form-control custom-form-control" formControlName="Reorder_level">
          </div>
        </div>
      </div>
    </div>

    <!-- Actions -->
    <div class="col-12">
      <div class="action-bar">
        <button class="btn btn-secondary" type="button">Cancel</button>
        <button class="btn btn-primary" type="submit" [disabled]="productForm.invalid">
          <i class="bi bi-check-circle me-1"></i> Save Product
        </button>
      </div>
    </div>

  </form>
</div>
