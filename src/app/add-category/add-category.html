<form [formGroup]="categoryForm" action="">
<div class="col-md-6">
            <label class="form-label">Category Name</label>
            <input type="text" class="form-control custom-form-control" formControlName="categoryName" id="categoryName">
          </div>
          <div class="col-md-6">
            <label class="form-label">Description</label>
            <input type="text" class="form-control custom-form-control" formControlName="description" id="description">
          </div>
          <div class="col-md-6">
            <label class="form-label">Is Active</label>
            <input type="checkbox" class="form-check-input custom-form-check-input" formControlName="isActive" id="isActive">
          </div>

</form>
