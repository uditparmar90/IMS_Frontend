<div class="app-layout d-flex">
  <!-- Sidebar -->
  <aside
    class="sidebar"
    [class.collapsed]="isCollapsed"
  >
    <!-- Brand -->
    <div class="sidebar-header">
      <div class="brand">
        <i class="bi bi-box-seam"></i>
        <span *ngIf="!isCollapsed">IMS</span>
      </div>

      <button class="toggle-btn" (click)="toggleSidebar()">
        <i class="bi" [ngClass]="isCollapsed ? 'bi-chevron-right' : 'bi-chevron-left'"></i>
      </button>
    </div>

    <!-- <router-outlet> -->
    <!-- Menu -->
     <div style="display: flex; flex-direction: column; justify-content:space-between ; height: 100vh;">
    <ul class="menu">
      <li>
        <a routerLink="/ProductList" routerLinkActive="active">
          <i class="bi bi-speedometer2"></i>
          <span *ngIf="!isCollapsed">Dashboard</span>
        </a>
      </li>

      <li>
        <a routerLink="/Product" routerLinkActive="active">
          <i class="bi bi-file-earmark-plus"></i>
          <span *ngIf="!isCollapsed">Products</span>
        </a>
      </li>

      <li>
        <a routerLink="/stock" routerLinkActive="active">
          <i class="bi bi-archive"></i>
          <span *ngIf="!isCollapsed">Stock</span>
        </a>
      </li>

      <li>
        <a routerLink="/warehouses" routerLinkActive="active">
          <i class="bi bi-buildings"></i>
          <span *ngIf="!isCollapsed">Warehouses</span>
        </a>
      </li>

      <li>
        <a routerLink="/reports" routerLinkActive="active">
          <i class="bi bi-graph-up"></i>
          <span *ngIf="!isCollapsed">Reports</span>
        </a>
      </li>
    </ul>
    <ul class="menu">

      <li>
        <!-- <a routerLink="/logout" routerLinkActive="active"> -->
          <div class="text-danger" routerLinkActive="active" style="    display: flex;
    align-items: center;
    gap: 14px;
    padding: 12px 14px;
    border-radius: 10px;
    text-decoration: none;
    transition: all 0.25s ease;">
<i class="bi bi-box-arrow-right"></i>
          <span *ngIf="!isCollapsed" (click)="logout()" style="cursor: pointer;">Logout</span>


          </div>
          
        <!-- </a> -->
      </li>
    </ul>
    </div>
    <!-- </router-outlet> -->
  </aside>

  <!-- Main Content -->
  <main class="content">
    <router-outlet></router-outlet>
  </main>
</div>
